<title>Roady Mobile Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone frame (412x860) on wide screens, full-bleed on a real phone. Screens and copy follow mobile/src/screens: Splash, Onboarding, Login, Sign-up, Home, Peta, Lapor, Riwayat, Profil. Dark navy tokens from mobile/src/theme/tokens.ts. */
:root{
  --bg:#0A1A33; --surface:#12294D; --raised:#1A3560; --accent:#9DB7E8; --fg:#FFFFFF; --sec:#C5CEDB; --muted:#8A96A8;
  --border:rgba(255,255,255,.12); --glass:rgba(255,255,255,.1); --edge:rgba(255,255,255,.2); --in:rgba(255,255,255,.06); --inedge:rgba(255,255,255,.14);
  --merah:#FD0000; --kuning:#C5B94B; --hijau:#3E8139; --ok:#3A7D34; --warn:#F9E63D; --bad:#B3261E; --err:#FFD9D6; --ink:#0A1A33;
  --ease:cubic-bezier(.2,.8,.2,1);
  --display:'Cal Sans','Plus Jakarta Sans',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme:dark; --st:78px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#050E1F;color:var(--fg);font:600 15px/1.45 var(--body);display:grid;place-items:center;padding:16px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3,p{margin:0}
.side{position:fixed;left:24px;top:24px;max-width:240px;color:var(--sec);font-size:13px;font-weight:400;display:none}
.side b{color:#fff;display:block;margin-bottom:6px}
@media(min-width:960px){.side{display:block}}
.phone{position:relative;width:412px;height:860px;max-height:calc(100vh - 32px);border-radius:46px;border:10px solid #14203A;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:clip;background:linear-gradient(160deg,#0A1A33,#12294D 60%,#2A4A7F)}
@media(max-width:540px){.sbar{display:none}.phone{--st:max(52px,calc(env(safe-area-inset-top,0px) + 20px))}body{padding:0;display:block}.phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0}}
.sbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:60;pointer-events:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:700;font-size:15px}
.sbar .isl{position:absolute;left:50%;top:12px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000}

.batik.tl{width:340px;left:-110px;top:-100px}
.batik.lm{width:200px;left:-100px;top:46%;opacity:.14}
.batik.br{width:320px;right:-100px;bottom:-110px;transform:scaleX(-1) rotate(-8deg)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .38s var(--ease) both;overflow:clip}
.scr.bk{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes drop{from{transform:translateY(-130%)}to{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.st>*{animation:rise .5s var(--ease) both}
.st>*:nth-child(1){animation-delay:.04s}.st>*:nth-child(2){animation-delay:.1s}.st>*:nth-child(3){animation-delay:.16s}.st>*:nth-child(4){animation-delay:.22s}.st>*:nth-child(5){animation-delay:.28s}.st>*:nth-child(6){animation-delay:.34s}
.shake{animation:shake .4s}
.sk{border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.18),rgba(255,255,255,.06));background-size:200% 100%;animation:shim 1.2s linear infinite}
.pad{padding-inline:25px}
.top{padding-top:var(--st)}
.brand{font:400 36px/40px var(--display);margin-left:3px}
.greet{font-size:16px;line-height:22px;margin:14px 0 0 3px}
.btn{min-height:42px;min-width:122px;border:0;border-radius:13px;background:#fff;color:var(--ink);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;transition:transform .12s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.7}
.btn.sec{background:transparent;color:#fff;border:1px solid var(--edge)}
.btn.full{width:100%}
.spin{width:16px;height:16px;border:2px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
:is(button,input,textarea,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.gin{background:var(--in);border:1px solid var(--inedge);border-radius:10px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.pill.ok{background:var(--ok)}.pill.wt{background:var(--warn);color:#3A3300}.pill.no{background:var(--bad)}.pill.nt{background:#000}
.pill.m{background:var(--merah)}.pill.k{background:var(--kuning)}.pill.h{background:var(--hijau)}
.link{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;padding:0}
.hide{display:none!important}
/* splash + onboarding */
.splash{align-items:center;justify-content:center;text-align:center}
.splash h1{font:400 68px/76px var(--display);animation:rise .6s var(--ease) both}
.splash p{font-size:18px;color:var(--border);color:rgba(255,255,255,.7);margin-top:2px;animation:rise .6s .2s var(--ease) both}
.obt{flex:.36;display:flex;flex-direction:column;padding:var(--st) 24px 0}
.skip{align-self:flex-end;min-height:44px;border:0;background:none;font-weight:800;font-size:14px;letter-spacing:.09em;padding:0 8px}
.obc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:24px;text-align:center}
.obc small{font:400 30px/34px var(--display)}.obc b{font:400 52px/56px var(--display)}
.sheet{flex:.64;border-radius:36px 36px 0 0;border-bottom:0;padding:24px 28px;display:flex;flex-direction:column}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.progress i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s var(--ease)}
.sheet p.t{font-size:16px;line-height:24px;margin-top:22px}
.acts{flex:1;display:flex;justify-content:flex-end;align-items:flex-start;gap:10px;padding-top:30px}
/* auth */
.auth{flex:1;display:flex;flex-direction:column;padding:0 30px 40px;overflow:auto;scrollbar-width:none}
.auth h1{font:400 28px/34px var(--display);text-align:center}
.fld{display:grid;gap:6px;font-weight:700;font-size:15px}
.fld input,.fld textarea,.field{height:45px;border-radius:9px;border:0;background:rgba(255,255,255,.88);color:#1A2740;padding:0 14px;font-weight:400;font-size:15px;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between}
.fld textarea{height:110px;padding:12px 14px;resize:none;color:#1A2740}
::placeholder{color:#6B7A92}
.fld input:focus-visible,.fld textarea:focus-visible{outline:2px solid var(--accent)}
.fe{color:var(--err);font-size:12px;font-weight:600;min-height:0}
.foot{display:flex;justify-content:center;gap:6px;margin-top:30px;font-size:15px}
/* tabs / app */
.body{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding-bottom:130px}
.body::-webkit-scrollbar{display:none}
.mapcard{height:308px;margin-top:18px;border-radius:24px;overflow:hidden;position:relative;background:var(--surface)}
.mapcard svg,.mapfull svg{width:100%;height:100%;display:block}
.expand{position:absolute;right:12px;bottom:19px;width:44px;height:44px;border-radius:22px;border:1px solid var(--border);background:var(--raised);display:grid;place-items:center}
.hh{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:0 14px 0 21px}
.hh h2{font:400 21px/1 var(--display)}
.arrow{width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
.rp{border-radius:26px;padding:12px;display:grid;gap:10px;margin-top:4px}
.rcard{padding:12px 14px;display:grid;gap:4px;text-align:left;width:100%;transition:transform .12s;color:#fff}
.rcard:active{transform:scale(.99)}
.rcard .tr{display:flex;justify-content:space-between;gap:8px}
.rcard b{font-size:15px}
.rcard .d{font-size:12px;color:var(--sec);font-weight:400}
.kv{display:grid;grid-template-columns:78px 1fr;gap:2px 8px;font-size:13px}
.kv span:nth-child(odd){color:var(--sec);font-weight:400}
.bar{position:absolute;left:0;right:0;bottom:-10px;height:104px;pointer-events:none;z-index:5}
.bar .bg{position:absolute;left:0;right:0;top:21px;height:83px;background:var(--surface);border-top:1px solid var(--border);border-radius:30px 30px 0 0}
.bar .fab{position:absolute;left:50%;top:0;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;color:var(--ink);pointer-events:auto;padding-bottom:10px;transition:transform .15s var(--ease)}
.bar .fab:active{transform:translateX(-50%) scale(.95)}
.bar .t{position:absolute;top:28px;width:96px;height:58px;border:0;background:none;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:auto;color:var(--muted);opacity:.75;transition:background .25s var(--ease),color .2s,opacity .2s}
.bar .t span{font-size:11px;font-weight:700;letter-spacing:.02em}
.bar .t[aria-selected=true]{color:#fff;opacity:1;background:rgba(157,183,232,.24);box-shadow:inset 0 0 0 1px rgba(157,183,232,.45)}
.bar .t[aria-selected=true] svg{color:var(--accent)}
.bar .t.l{left:calc(25% - 54px)}.bar .t.r{right:calc(25% - 54px)}
.bar .t svg{width:26px;height:26px}
.bar .fab svg{width:38px;height:38px}
/* sub screens */
.sh{display:flex;align-items:center;gap:12px;padding:var(--st) 25px 0}
.sh h2{font:400 24px/1 var(--display)}
.back{width:44px;height:44px;border-radius:50%;border:0;background:var(--raised);display:grid;place-items:center;flex:none}
.loc{padding:14px 25px 0;font-size:14px}.loc b{font-weight:600;color:var(--sec)}
.mapfull{position:relative;flex:1;margin-top:12px;overflow:hidden}
.legend{position:absolute;left:12px;top:12px;background:rgba(10,26,51,.72);border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:11px;display:grid;gap:3px}
.legend div{display:flex;align-items:center;gap:6px;font-weight:600}.legend i{width:9px;height:9px;border-radius:50%}
.zs{position:absolute;left:0;right:0;bottom:0;border-radius:26px 26px 0 0;border-bottom:0;padding:18px 22px 26px;display:grid;gap:10px;background:rgba(18,41,77,.92);animation:rise .3s var(--ease) both;z-index:4}
.zs .hd{display:flex;justify-content:space-between;align-items:center}
.zs h3{font:400 20px/1 var(--display)}
.x{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1)}
.score{font:400 40px/1 var(--display)}
.dd{position:relative}
.dd .field{cursor:pointer;color:#5A6A84}
.dd .field.has{color:#1A2740;font-weight:600}
.dd .field.bad{outline:2px solid var(--err)}
.ddl{position:absolute;left:0;right:0;top:50px;border-radius:12px;background:var(--raised);border:1px solid var(--edge);overflow:hidden;z-index:6;animation:pop .18s var(--ease);transform-origin:top}
.ddl button{display:block;width:100%;text-align:left;height:44px;border:0;background:none;padding:0 14px;font-weight:600}
.ddl button+button{border-top:1px solid var(--border)}
.ddl button:hover{background:rgba(255,255,255,.1)}
.note{font-size:12px;color:var(--sec);font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{height:46px;border-radius:12px;border:1px solid var(--inedge);background:var(--in);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,border-color .2s,color .2s,transform .12s}
.seg button:active{transform:scale(.98)}
.seg button[aria-checked=true]{background:#fff;color:var(--ink);border-color:#fff}
.seg.bad button{border-color:var(--err)}
.src{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.src button{height:84px;border-radius:16px;border:1px dashed rgba(255,255,255,.45);background:var(--in);display:grid;place-items:center;align-content:center;gap:4px;font-weight:700;font-size:14px;transition:background .2s,transform .12s}
.src button:active{transform:scale(.97);background:rgba(255,255,255,.14)}
.prev{border-radius:16px;overflow:hidden;border:1px solid var(--inedge);background:var(--in);animation:pop .3s var(--ease)}
.prev .im{height:150px;background:linear-gradient(135deg,#2A5A9C,#0E2142);display:grid;place-items:center;color:rgba(255,255,255,.6);position:relative}
.prev .bd{position:absolute;left:10px;bottom:10px}
.prev .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;font-size:13px}
.prev .row button{border:0;background:rgba(255,255,255,.12);border-radius:10px;height:34px;padding:0 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.wt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sec);font-weight:400}
.info{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:17px;color:var(--sec);font-weight:400;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06)}
.info svg{flex:none;margin-top:1px}
.upl{flex-direction:column;gap:6px;height:104px;border-radius:16px;color:var(--sec);transition:background .2s,transform .12s}
.upl:active{transform:scale(.98);background:rgba(255,255,255,.1)}
.asheet{position:absolute;inset:0;z-index:50;background:rgba(3,10,22,.55);display:flex;align-items:flex-end;animation:rise .2s both}
.asheet>div{width:100%;border-radius:26px 26px 0 0;background:rgba(18,41,77,.98);border:1px solid var(--edge);border-bottom:0;padding:18px 20px 30px;display:grid;gap:8px;animation:rise .3s var(--ease) both}
.asheet button{height:52px;border-radius:14px;border:0;background:var(--in);font-weight:700;display:flex;align-items:center;gap:12px;padding:0 16px}
.asheet button.c{justify-content:center;background:none;color:var(--sec)}
.upl_old{height:46px;border-radius:9px;border:1px dashed rgba(255,255,255,.5);background:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-weight:600}
.upl[aria-pressed=true]{border-style:solid;background:rgba(62,129,57,.35)}
.done{flex:1;display:flex;flex-direction:column;padding:0 25px 36px}
.done .mid{flex:1;display:grid;place-items:center;text-align:center;gap:12px;align-content:center}
.done svg circle{stroke-dasharray:260;stroke-dashoffset:260;animation:draw .7s var(--ease) forwards}
.done svg path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .55s var(--ease) forwards}
.prof{padding:18px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;border-radius:22px;margin-top:18px}
.avc{width:64px;height:64px;border-radius:50%;background:#fff}
.gm{border-radius:20px;margin-top:14px;overflow:hidden}
.gm button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;border:0;background:none;padding:0 20px;font-weight:700;font-size:15px}
.gm button+button{border-top:1px solid var(--inedge)}
.gm button:active{background:rgba(255,255,255,.08)}
.alert{position:absolute;left:12px;right:12px;top:calc(var(--st) - 12px);z-index:30;padding:14px 16px;border-radius:20px;background:#3A2A06;border:1px solid #F2C260;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:drop .45s var(--ease);display:flex;gap:12px;align-items:start}
.alert .ic{width:38px;height:38px;border-radius:12px;background:#F2C260;color:#2B1D00;display:grid;place-items:center;flex:none;font:400 20px var(--display)}
.alert b{display:block;color:#FFE6A8}.alert span{color:#F6DDA0;font-size:13px;font-weight:400}
.alert button{margin-left:auto;border:0;background:none;color:#FFE6A8;font-size:18px;padding:0 4px}
.toast{position:absolute;left:50%;top:62px;transform:translate(-50%,-20px);opacity:0;background:#1B3A6B;border:1px solid var(--edge);border-radius:14px;padding:10px 18px;font-weight:700;font-size:14px;transition:.3s var(--ease);z-index:40;white-space:nowrap;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:22px 10px;font-size:14px;line-height:20px}
.mapme circle:first-child{animation:ring 1.8s infinite;transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.done svg circle,.done svg path{stroke-dashoffset:0}}
</style>

<div class="side"><b>Prototipe mobile Roady!</b>Alur, teks, dan struktur layar mengikuti kode mobile/ di repomu. Di Peta, tekan "Simulasi mendekati zona" untuk melihat peringatan 300 m. Password minimal 8 karakter dan memuat angka.</div>

<div class="phone" id="phone">
  <div class="sbar" aria-hidden="true"><span>17.54</span><i class="isl"></i><span>76%</span></div>
  <div class="batik tl"></div><div class="batik lm"></div><div class="batik br"></div>

</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var root=$('root'),over=$('over'),toast=$('toast');
  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(function(){toast.classList.remove('on')},2600)}
  var P={
    home:'<path d="M3 11l9-8 9 8v10H3z"/>',

    exp:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
    arr:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8l4 4-4 4"/>',
    back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
    cam:'<rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.5"/>',
    out:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>',
    set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
    del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    up:'<path d="M7 18a4 4 0 010-8 5 5 0 019.7-1A4.5 4.5 0 0117 18M12 12v7M9 15l3-3 3 3"/>',
    img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 8v.5M12 11.5V16"/>',
    chk:'<path d="M5 12l5 5 9-10"/>',
    pin:'<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'
  };
  function ic(n,w){return '<svg viewBox="0 0 24 24" width="'+(w||24)+'" height="'+(w||24)+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>'}

  var ZONES=[
    {id:1,n:'Simpang Dago',x:250,y:90,s:93,k:12,w:true,u:'30-10-2026 14:20'},
    {id:2,n:'Jl. Soekarno Hatta',x:330,y:190,s:86,k:21,w:true,u:'30-10-2026 09:05'},
    {id:3,n:'Jl. Cihampelas',x:130,y:150,s:58,k:5,w:false,u:'29-10-2026 17:40'},
    {id:4,n:'Cibiru',x:360,y:60,s:31,k:12,w:false,u:'28-10-2026 08:12'},
    {id:5,n:'Alun-alun Bandung',x:190,y:230,s:34,k:3,w:true,u:'27-10-2026 21:30'}
  ];
  var REPORTS=[
    {id:12,tgl:'14-10-2026',ds:'Motor tergelincir di tikungan Dago, jalan licin setelah hujan',st:'wt',loc:'Jl. Dago, Bandung (-6.8851, 107.6131)',kej:'Kecelakaan',cu:'Hujan'},
    {id:11,tgl:'12-10-2026',ds:'Hampir tertabrak mobil dari arah kiri di Simpang Dago',st:'ok',loc:'Jl. Cihampelas, Bandung (-6.8995, 107.6040)',kej:'Nyaris celaka',cu:'Cerah'},
    {id:10,tgl:'09-10-2026',ds:'Bis beruntun depan DU, satu motor terjatuh',st:'nt',loc:'Jl. Soekarno Hatta, Bandung (-6.9393, 107.6616)',kej:'Kecelakaan',cu:'Hujan'}
  ];
  var ST={wt:'Menunggu Konfirmasi',ok:'Diterima',nt:'Masuk Otomatis',no:'Ditolak'};
  var OB=[
    'Hai sobat Roady, terima kasih sudah mempunyai keinginan berkontribusi untuk menjaga keselamatan lalu lintas!',
    'Dari survei yang telah kami lakukan, banyak orang merasa terbantu dengan info jalan rawan kecelakaan. Kini, kami hadir sebagai penyedia informasi wilayah rawan paling update demi keamanan perjalananmu!',
    'Selain dari tim kami, Sobat Roady juga bisa ikut melengkapi info kecelakaan terbaru yang ditemui. Kepedulianmu sangat berarti untuk membantu sesama pengendara agar tetap aman.'
  ];
  var S={scr:'splash',ob:0,mode:'login',user:null,zone:null,hist:[],kat:null,cu:null,foto:false,fp:null,fk:null,open:null,sel:null,lapErr:{}};
  var simT=null;

  function show(name,html,back){
    S.scr=name;over.innerHTML='';
    root.innerHTML='<section class="scr'+(back?' bk':'')+'" aria-label="'+name+'">'+html+'</section>';
    var f=root.querySelector('[data-focus]');if(f)f.focus({preventScroll:true});
  }
  function nav(name,opts){
    opts=opts||{};if(!opts.back&&['home','profil'].indexOf(S.scr)>-1&&['home','profil'].indexOf(name)<0)S.hist.push(S.scr);
    ({splash:splash,ob:onb,perm:perm,auth:auth,home:home,peta:peta,lapor:lapor,done:done,riwayat:riwayat,detail:detail,profil:profil})[name](opts.back);
  }
  function backTo(){var p=S.hist.pop()||'home';nav(p,{back:true})}

  function bar(active){
    return '<div class="bar"><div class="bg"></div><button class="t l" role="tab" data-nav="home" aria-label="Beranda" aria-selected="'+(active==='home')+'">'+ic('home',26)+'<span>Beranda</span></button><button class="fab" data-nav="lapor" aria-label="Laporkan kejadian">'+ic('rep',38)+'</button><button class="t r" role="tab" data-nav="profil" aria-label="Profil" aria-selected="'+(active==='profil')+'">'+ic('acc',26)+'<span>Profil</span></button></div>';
  }
  function head(t,back){return '<div class="sh"><button class="back" data-back aria-label="Kembali">'+ic('back',22)+'</button><h2>'+t+'</h2></div>'}

  /* splash */
  function splash(){
    show('splash','<div class="splash" style="display:flex;flex-direction:column;flex:1;align-items:center;justify-content:center;text-align:center"><h1>Roady</h1><p>teman mengemudimu</p></div>');
    clearTimeout(splash.t);splash.t=setTimeout(function(){if(S.scr==='splash')onb()},rm?300:2200);
  }
  root.addEventListener('click',function(e){if(S.scr==='splash'&&!e.target.closest('button')){clearTimeout(splash.t);onb()}});

  /* onboarding */
  function onb(back){
    var last=S.ob===OB.length-1;
    show('onboarding','<div class="obt"><button class="skip" data-act="skip" aria-label="Lewati pengenalan">LEWATI</button><div class="obc st"><small>selamat datang di</small><b>Roady!</b></div></div>'
    +'<div class="glass sheet"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(S.ob/(OB.length-1)*100)+'"><i style="width:'+(S.ob/(OB.length-1)*100)+'%"></i></div><p class="t" aria-live="polite">'+OB[S.ob]+'</p><div class="acts">'+(S.ob>0?'<button class="btn sec" data-act="prev">Kembali</button>':'')+'<button class="btn" data-act="'+(last?'skip':'next')+'" data-focus>'+(last?'Selesai':'Selanjutnya')+'</button></div></div>',back);
  }

  /* location permission */
  function perm(){
    show('perm','<div class="top pad"><div class="brand">Roady!</div></div><div style="flex:1;display:flex;align-items:flex-end"><div class="glass sheet" style="flex:none;width:100%;gap:12px;padding-bottom:34px"><h2 style="font:400 26px/30px var(--display)">Aktifkan lokasi</h2><p style="font-size:15px;line-height:22px;font-weight:600">Lokasi dipakai di perangkatmu untuk menghitung jarak ke zona rawan dan memberi peringatan dini saat kamu mendekat. Laporan kejadian juga membutuhkan lokasi.</p><button class="btn full" style="margin-top:12px" data-act="allow" data-focus>Izinkan lokasi</button><button class="link" style="padding:12px" data-act="later">Nanti saja</button></div></div>');
  }

  /* auth */
  function auth(back,err){
    var lg=S.mode==='login';
    show('auth','<div class="auth st" style="padding-top:90px"><h1>'+(lg?'Login':'Sign-up')+'</h1><form id="af" novalidate style="display:grid;gap:12px;margin-top:'+(lg?42:24)+'px">'
    +(lg?'':'<label class="fld" for="nm">Nama Lengkap<input id="nm" placeholder="Jane Doe" autocomplete="name"></label>')

    +'<div class="fe" id="er" role="alert">'+(err||'')+'</div><div style="display:grid;justify-items:center"><button class="btn" id="ab" type="submit" style="min-width:150px">'+(lg?'Login':'Signup')+'</button></div></form>'

  }
  function authSubmit(){
    var f=$('af'),lg=S.mode==='login',em=$('em').value.trim(),pw=$('pw').value,er=$('er'),ab=$('ab');
    function bad(m){er.textContent=m;f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}
    if(!lg&&!$('nm').value.trim())return bad('Nama lengkap wajib diisi.');
    if(!em||!pw)return bad('Email dan kata sandi wajib diisi.');
    if(!/^\S+@\S+\.\S+$/.test(em))return bad('Format email belum benar.');

    setTimeout(function(){
      if(pw==='salah1234'){ab.disabled=false;ab.textContent='Login';return bad('Email atau password salah.')}
      S.user={n:lg?'Jane Doe':$('nm').value.trim(),e:em,k:'RW-0412'};S.hist=[];home();
    },900);
  }

  /* map svg */
  function mapSvg(opts){
    opts=opts||{};var h='<svg viewBox="0 0 412 '+(opts.h||308)+'" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Peta zona risiko Bandung Raya"><rect width="412" height="700" fill="#0F2347"/>'
    +'<path d="M-10 270C90 255 170 300 260 280S380 235 430 250" stroke="rgba(95,150,230,.3)" stroke-width="12" fill="none" stroke-linecap="round"/>'
    +'<g stroke="rgba(157,183,232,.26)" stroke-width="4" fill="none" stroke-linecap="round"><path d="M0 170C110 160 280 185 412 165"/><path d="M200 0C190 120 215 240 200 420"/><path d="M40 20C110 100 170 180 230 250S340 340 400 400"/><path d="M60 420C80 330 90 250 70 170"/></g>';
    ZONES.forEach(function(z){var c=z.s>80?'#FD0000':z.s>=50?'#C5B94B':'#3E8139',sel=S.zone===z.id;
      h+='<g'+(opts.tap?' class="zc" data-zone="'+z.id+'" tabindex="0" role="button" aria-label="'+esc(z.n)+', skor '+z.s+'" style="cursor:pointer"':'')+'><circle cx="'+z.x+'" cy="'+z.y+'" r="'+(sel?44:38)+'" fill="'+c+'" fill-opacity=".3" stroke="'+c+'" stroke-width="'+(sel?3:1.5)+'"/><circle cx="'+z.x+'" cy="'+z.y+'" r="5" fill="'+c+'"/></g>'});
    if(opts.me)h+='<g class="mapme"><circle cx="205" cy="'+(opts.h?300:215)+'" r="14" fill="#9DB7E8"/><circle cx="205" cy="'+(opts.h?300:215)+'" r="7" fill="#fff" stroke="#9DB7E8" stroke-width="3"/></g>';
    return h+'</svg>';
  }
  function rcard(r,full){
    return '<button class="gin rcard" data-open="'+r.id+'" aria-label="Laporan '+r.id+', buka detail">'+(full?'<div class="tr"><span class="d">'+r.tgl+'</span></div><div style="height:96px;border-radius:8px;background:linear-gradient(135deg,#1E3F73,#0E2142);display:grid;place-items:center;color:var(--sec)">'+ic('cam',30)+'</div>':'')+'<div class="tr"><b>Laporan #'+r.id+'</b>'+(full?'':'<span class="d">'+r.tgl+'</span>')+'</div><div class="kv"><span>Deskripsi:</span><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;color:#fff">'+esc(r.ds)+'</span>'+(full?'<span>Lokasi:</span><span style="font-weight:600;color:#fff">'+esc(r.loc)+'</span>':'')+'<span>Status:</span><span><span class="pill '+r.st+'">'+ST[r.st]+'</span></span></div></button>';
  }

  /* home */
  function home(back){
    S.zone=null;
    show('home','<div class="body"><div class="top pad"><div class="brand">Roady!</div><p class="greet">Hai sobat Roady, siap berkendara hari ini?</p>'
    +'<div class="mapcard" id="mc"><div class="sk" style="position:absolute;inset:0;border-radius:0"></div></div>'
    +'<div class="hh"><h2>Riwayat Laporan</h2><button class="arrow" data-nav="riwayat" aria-label="Lihat semua riwayat laporan">'+ic('arr',33)+'</button></div>'
    +'<div class="glass rp" id="rp"><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div></div></div></div>'+bar('home'),back);
    setTimeout(function(){
      if(S.scr!=='home')return;
      $('mc').innerHTML=mapSvg({me:false})+'<button class="expand" data-nav="peta" aria-label="Buka peta penuh">'+ic('exp',24)+'</button>';
      $('rp').innerHTML=REPORTS.slice(0,2).reverse().map(function(r,i){return '<div style="animation:rise .4s '+(i*80)+'ms var(--ease) both">'+rcard(r)+'</div>'}).join('');
    },rm?0:600);
  }

  /* peta */
  function peta(back){
    S.zone=null;
    show('peta',head('Peta')+'<div class="loc"><b>Lokasi Anda:</b> Jl. Braga, Bandung</div><div class="mapfull" id="mf">'+mapSvg({h:520,me:true,tap:true})
    +'<div class="legend"><b style="font-size:11px">Skor risiko (persentil)</b><div><i style="background:#FD0000"></i>Merah <span style="color:var(--sec);font-weight:400">&gt; 80</span></div><div><i style="background:#C5B94B"></i>Kuning <span style="color:var(--sec);font-weight:400">50 sampai 80</span></div><div><i style="background:#3E8139"></i>Hijau <span style="color:var(--sec);font-weight:400">&lt; 50</span></div></div>'
    +'<button class="btn sec" id="simb" data-act="sim" style="position:absolute;right:12px;top:12px;min-height:36px;min-width:0;font-size:12px;background:rgba(10,26,51,.72)">Simulasi mendekati zona</button><div id="zs"></div></div>',back);
  }
  function zsheet(){
    var z=ZONES.filter(function(q){return q.id===S.zone})[0],h=$('zs');if(!h)return;
    if(!z){h.innerHTML='';return}
    var c=z.s>80?'m':z.s>=50?'k':'h',cn={m:'Merah',k:'Kuning',h:'Hijau'}[c];
    h.innerHTML='<div class="glass zs" role="dialog" aria-label="Detail zona"><div class="hd"><h3>'+esc(z.n)+'</h3><button class="x" data-act="zclose" aria-label="Tutup">✕</button></div><div><span class="pill '+c+'">'+cn+'</span></div><div><span class="score">'+z.s+'%</span><p class="note">skor risiko (persentil di antara semua zona)</p></div><div class="kv" style="grid-template-columns:130px 1fr"><span>Jumlah kejadian</span><span style="font-weight:600;color:#fff">'+z.k+' kejadian</span><span>Bergantung cuaca</span><span style="font-weight:600;color:#fff">'+(z.w?'Ya, risiko naik saat hujan':'Tidak')+'</span><span>Terakhir diperbarui</span><span style="font-weight:600;color:#fff">'+z.u+'</span></div></div>';
  }
  function sim(){
    if(simT){clearInterval(simT);simT=null;over.innerHTML='';$('simb').textContent='Simulasi mendekati zona';return}
    $('simb').textContent='Hentikan simulasi';var d=900,shown=false;
    simT=setInterval(function(){
      d-=60;if(S.scr!=='peta'){clearInterval(simT);simT=null;return}
      if(d<=300&&!shown){shown=true;over.innerHTML='<div class="alert" role="alert"><div class="ic">!</div><div><b>Zona rawan 300 m di depan</b><span>Simpang Dago. Jalan licin karena hujan, kurangi kecepatan.</span></div><button data-act="alertx" aria-label="Tutup peringatan">✕</button></div>';setTimeout(function(){over.innerHTML=''},6000)}
      if(d<=120){clearInterval(simT);simT=null;var b=$('simb');if(b)b.textContent='Simulasi mendekati zona'}
    },rm?60:350);
  }

  /* dropdown */
  function dd(id,ph,opts,val,bad){
    var lab=opts.filter(function(o){return o===val})[0];
    return '<div class="dd" id="dd_'+id+'"><button type="button" class="field'+(lab?' has':'')+(bad?' bad':'')+'" data-dd="'+id+'" aria-haspopup="listbox" aria-expanded="false"><span>'+(lab||ph)+'</span>'+ic('back',16).replace('M19 12H5M11 6l-6 6 6 6','M6 9l6 6 6-6')+'</button></div>';
  }
  function openDd(id,opts,cur,onPick){
    var el=$('dd_'+id);if(!el)return;var ex=el.querySelector('.ddl');if(ex){ex.remove();return}
    var l=document.createElement('div');l.className='ddl';l.setAttribute('role','listbox');
    l.innerHTML=(onPick.clear?'<button data-v="">Semua</button>':'')+opts.map(function(o){return '<button role="option" data-v="'+o+'">'+o+'</button>'}).join('');
    l.onclick=function(e){var b=e.target.closest('button');if(!b)return;onPick(b.dataset.v||null)};
    el.appendChild(l);el.querySelector('button').setAttribute('aria-expanded','true');
  }

  /* lapor */
  var KAT=['Kecelakaan','Nyaris celaka'],CUA=['Hujan','Cerah'];
  function seg(id,lab,opts,val,err){
    return '<div class="fld"><span>'+lab+'</span><div class="seg'+(err?' bad':'')+'" role="radiogroup" aria-label="'+lab+'">'+opts.map(function(o){return '<button type="button" role="radio" aria-checked="'+(val===o)+'" data-seg="'+id+'" data-v="'+o+'">'+(val===o?ic('chk',16):'')+o+'</button>'}).join('')+'</div>'+(err?'<span class="fe">'+err+'</span>':'')+'</div>';
  }
  function upl(){
    var h='<div class="fld"><span>Foto <span style="font-weight:400;color:var(--sec)">(opsional)</span></span>';
    if(!S.foto)h+='<button type="button" class="upl" data-act="pick" aria-haspopup="dialog">'+ic('up',30)+'<span>Ketuk untuk tambah foto</span></button><div class="wt">Tanpa foto, bobot laporan 0,5 dan langsung masuk otomatis.</div>';
    else h+='<div class="prev"><div class="im">'+ic('cam',44)+'<span class="pill ok bd" style="display:inline-flex;gap:4px;align-items:center">'+ic('chk',13)+'Bobot 1,0, diverifikasi Admin</span></div><div class="row"><span>IMG_2041.jpg · 1,8 MB</span><span style="display:flex;gap:6px"><button type="button" data-act="foto" aria-label="Ganti foto">Ganti</button><button type="button" data-act="fotodel" aria-label="Hapus foto" style="color:#FFD9D6">'+ic('del',15)+'Hapus</button></span></div></div>';
    return h+'<div class="info">'+ic('info',16)+'<span>Harap tidak mengirim foto yang berisi wajah korban!</span></div></div>';
  }
  function lapor(back){
    var e=S.lapErr;
    show('lapor',head('Laporkan Kejadian')+'<div class="body pad st" style="padding-top:12px;display:grid;gap:14px;align-content:start"><div style="font-size:14px"><b style="font-weight:600;color:var(--sec)">Lokasi Anda:</b> Jl. Braga No. 12, Bandung</div>'
    +seg('kat','Kejadian',KAT,S.kat,e.kat)+seg('cu','Cuaca',CUA,S.cu,e.cu)
    +'<label class="fld" for="ds">Deskripsi Kejadian<textarea id="ds" placeholder="Contoh: depan DU ada kecelakaan bis beruntun">'+esc(S.ds||'')+'</textarea>'+(e.ds?'<span class="fe">'+e.ds+'</span>':'')+'</label>'
    +upl()
    +'<button class="btn full" id="kirim" data-act="kirim" style="margin-top:6px">Kirim laporan</button></div>',back);
  }
  function done(){
    REPORTS.unshift({id:13,tgl:'02-11-2026',ds:S.ds||'Laporan baru',st:S.foto?'wt':'nt',loc:'Jl. Braga No. 12, Bandung (-6.9175, 107.6191)',kej:S.kat,cu:S.cu});
    show('done','<div class="sh"><h2 style="margin-left:6px">Laporkan Kejadian</h2></div><div class="done"><div class="mid"><svg viewBox="0 0 96 96" width="96" height="96" fill="none" aria-hidden="true"><circle cx="48" cy="48" r="41" stroke="#5FD3A0" stroke-width="5"/><path d="M30 49l13 13 24-26" stroke="#5FD3A0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><p style="font-size:17px;line-height:25px;max-width:26ch;animation:rise .5s .6s var(--ease) both">'+(S.foto?'Terima kasih! Laporanmu akan diverifikasi Admin sebelum menambah skor zona.':'Terima kasih! Laporanmu langsung masuk dengan bobot 0,5.')+'</p></div><button class="btn full" data-act="selesai" data-focus>Selesai</button></div>');
    S.kat=S.cu=null;S.ds='';S.foto=false;S.lapErr={};
  }

  /* riwayat + detail */
  function riwayat(back){
    var list=REPORTS.filter(function(r){return(!S.fp||ST[r.st]===S.fp)&&(!S.fk||r.kej===S.fk)});
    show('riwayat',head('Riwayat Laporan')+'<div class="body pad" style="padding-top:14px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;position:relative;z-index:7">'+dd('fp','Progress',['Menunggu Konfirmasi','Diterima','Masuk Otomatis','Ditolak'],S.fp)+dd('fk','Kejadian',KAT,S.fk)+'</div><div style="display:grid;gap:10px" class="st">'+(list.length?list.map(function(r){return '<div class="glass" style="border-radius:20px;padding:10px">'+rcard(r,true)+'</div>'}).join(''):'<div class="empty">Tidak ada laporan yang cocok dengan filter ini.</div>')+'</div></div>',back);
  }
  function detail(back){
    var r=REPORTS.filter(function(x){return x.id===S.open})[0];if(!r)return riwayat();
    show('detail',head('Detail Laporan')+'<div class="body pad st" style="padding-top:14px;display:grid;gap:12px;align-content:start"><div style="height:170px;border-radius:14px;background:linear-gradient(135deg,#1E3F73,#0E2142);display:grid;place-items:center;color:var(--sec)">'+ic('cam',40)+'</div><div class="glass" style="border-radius:20px;padding:16px;display:grid;gap:10px"><div style="display:flex;justify-content:space-between"><b style="font:400 20px var(--display)">Laporan #'+r.id+'</b><span class="pill '+r.st+'">'+ST[r.st]+'</span></div><div class="kv" style="grid-template-columns:90px 1fr"><span>Tanggal:</span><span style="color:#fff;font-weight:600">'+r.tgl+'</span><span>Kejadian:</span><span style="color:#fff;font-weight:600">'+r.kej+'</span><span>Cuaca:</span><span style="color:#fff;font-weight:600">'+r.cu+'</span><span>Lokasi:</span><span style="color:#fff;font-weight:600">'+esc(r.loc)+'</span><span>Deskripsi:</span><span style="color:#fff;font-weight:600">'+esc(r.ds)+'</span></div></div></div>',back);
  }

  /* profil */
  function profil(back){
    var fn=S.user.n.split(' ')[0];
    show('profil','<div class="body"><div class="top pad"><div class="brand">Roady!</div><p class="greet">Hai, '+esc(fn)+'!</p><div class="glass prof st"><div class="avc"></div><div><b style="font-size:17px;display:block">'+esc(S.user.n)+'</b><span style="color:var(--sec);font-weight:400;font-size:14px">'+esc(S.user.e)+'</span><br><span style="font-size:13px;color:var(--accent)">Kode pengguna '+S.user.k+'</span></div></div>'
    +'<div style="display:grid;justify-items:end;margin-top:12px"><button class="btn sec" data-act="edit" style="min-width:0;min-height:38px">Edit Profil</button></div>'
    +'<div class="glass gm st"><button data-act="logout"><span>Keluar akun</span>'+ic('out',22)+'</button><button data-act="set"><span>Pengaturan</span>'+ic('set',24)+'</button></div><div class="glass gm"><button data-act="hapus" style="color:#FFD9D6"><span>Hapus akun</span>'+ic('del',24)+'</button></div></div></div>'+bar('profil'),back);
  }
  function confirmLogout(){
    over.innerHTML='<div style="position:absolute;inset:0;background:rgba(3,10,22,.6);z-index:50;display:grid;place-items:center;animation:rise .2s both"><div class="glass" style="width:84%;border-radius:22px;padding:22px;display:grid;gap:12px;background:rgba(18,41,77,.96)"><h3 style="font:400 20px var(--display)">Keluar akun</h3><p style="font-weight:400">Anda akan keluar dari akun ini.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" data-act="alertx" style="min-width:0">Batal</button><button class="btn" data-act="out" style="min-width:0">Keluar</button></div></div></div>';
  }

  /* events */
  document.addEventListener('click',function(e){
    var t=e.target,m;
    if(!t.closest('.dd')){[].forEach.call(document.querySelectorAll('.ddl'),function(l){l.remove()})}
    if(m=t.closest('[data-nav]')){var n=m.dataset.nav;if(n==='home'||n==='profil')S.hist=[];nav(n);return}
    if(t.closest('[data-back]')){if(simT){clearInterval(simT);simT=null}backTo();return}
    if(m=t.closest('[data-open]')){S.open=+m.dataset.open;nav('detail');return}
    if(m=t.closest('[data-zone]')){S.zone=+m.dataset.zone;var mf=$('mf');var g=mf.querySelectorAll('.zc');peta2();return}
    if(m=t.closest('[data-seg]')){S.ds=($('ds')||{}).value||S.ds;var kk=m.dataset.seg;S[kk]=m.dataset.v;S.lapErr[kk]=null;lapor2();return}
    if(m=t.closest('[data-dd]')){var id=m.dataset.dd;
      if(id==='kat')openDd(id,KAT,S.kat,function(v){S.kat=v;S.lapErr.kat=null;lapor2()});
      else if(id==='cu')openDd(id,CUA,S.cu,function(v){S.cu=v;S.lapErr.cu=null;lapor2()});
      else if(id==='fp'){var f=function(v){S.fp=v;riwayat2()};f.clear=true;openDd(id,['Menunggu Konfirmasi','Diterima','Masuk Otomatis','Ditolak'],S.fp,f)}
      else if(id==='fk'){var f2=function(v){S.fk=v;riwayat2()};f2.clear=true;openDd(id,KAT,S.fk,f2)}
      return}
    var a=(t.closest('[data-act]')||{dataset:{}}).dataset.act;if(!a)return;
    if(a==='skip'){S.ob=0;perm()}
    else if(a==='next'){S.ob++;onb()}
    else if(a==='prev'){S.ob--;onb(true)}
    else if(a==='allow'||a==='later'){S.mode='login';auth()}
    else if(a==='mode'){S.mode=S.mode==='login'?'signup':'login';auth()}
    else if(a==='zclose'){S.zone=null;peta2()}
    else if(a==='sim')sim();
    else if(a==='alertx')over.innerHTML='';
    else if(a==='pick'){over.innerHTML='<div class="asheet" data-act="alertx"><div role="dialog" aria-label="Tambah foto"><b style="font:400 18px var(--display);margin-bottom:4px">Tambah foto</b><button data-act="foto">'+ic('cam',22)+'Ambil foto</button><button data-act="foto">'+ic('img',22)+'Pilih dari galeri</button><button class="c" data-act="alertx">Batal</button></div></div>'}
    else if(a==='foto'||a==='fotodel'){S.ds=($('ds')||{}).value||S.ds;S.foto=a==='foto';lapor2();if(a==='foto')say('Foto ditambahkan (contoh)')}
    else if(a==='kirim'){
      S.ds=$('ds').value;var er={};if(!S.kat)er.kat='Pilih jenis kejadian.';if(!S.cu)er.cu='Pilih kondisi cuaca.';if(!S.ds.trim())er.ds='Deskripsi wajib diisi.';
      S.lapErr=er;if(Object.keys(er).length){lapor2();var b=root.querySelector('.body');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
      var k=$('kirim');k.disabled=true;k.innerHTML='<span class="spin"></span>';setTimeout(done,1000)}
    else if(a==='selesai'){S.hist=[];home()}
    else if(a==='logout')confirmLogout();
    else if(a==='out'){over.innerHTML='';S.user=null;S.hist=[];S.mode='login';auth()}
    else if(a==='set'||a==='edit'||a==='hapus')say(a==='hapus'?'Hapus akun belum tersedia':'Halaman ini belum ada di prototipe');
  });
  function peta2(){var b=$('mf');if(!b)return;var svg=b.querySelector('svg');var tmp=document.createElement('div');tmp.innerHTML=mapSvg({h:520,me:true,tap:true});svg.replaceWith(tmp.firstChild);zsheet()}
  function lapor2(){var sc=root.querySelector('.body');var y=sc?sc.scrollTop:0;var v=($('ds')||{}).value;if(v!==undefined)S.ds=v;lapor(true);var n=root.querySelector('.scr');n.style.animation='none';var b=root.querySelector('.body');if(b)b.scrollTop=y}
  function riwayat2(){riwayat(true);var n=root.querySelector('.scr');n.style.animation='none'}
  document.addEventListener('submit',function(e){if(e.target.id==='af'){e.preventDefault();authSubmit()}});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){over.innerHTML='';[].forEach.call(document.querySelectorAll('.ddl'),function(l){l.remove()})}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.zc')){e.preventDefault();S.zone=+e.target.dataset.zone;peta2()}
  });
  document.title='Roady!';
  splash();
})();
</script>
